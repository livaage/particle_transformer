name: particle_transformer
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.12              # or 3.10, but check that all packages are compatible
  - pytorch=2.2             # adjust as needed (use the right CUDA version if needed)
    # - pytorch-cuda=11.8       # for GPU support
  - torchvision
  - numpy
  - scipy
  - matplotlib
  - pip
  - pyarrow
  - pip:
      - weaver-core>=0.4
      - torch-scatter
      - torch-cluster
      - torch-spline-conv
